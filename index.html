  <!-- GA4: CTA + form tracking (audit-ready params) -->
  <script>
    function track(eventName, params){
      try{
        if(typeof gtag === "function"){
          gtag("event", eventName, params || {});
        }
      }catch(e){}
    }

    function getSectionLocation(el){
      const section = el.closest("section[id]");
      if(section && section.id) return section.id;

      if(el.closest("header")) return "header";
      if(el.closest("footer")) return "footer";
      if(el.closest("aside"))  return "drawer";
      return "body";
    }

    document.addEventListener("click", function(e){
      const a = e.target.closest("a");
      if(!a) return;

      const isCta =
        a.matches(".btn.primary, .footerBtn--primary, .siteNav__cta, .navDrawer__link--cta") ||
        a.hasAttribute("data-preset");

      if(!isCta) return;

      const ctaText = (a.textContent || "").trim().replace(/\s+/g, " ").slice(0, 80);
      const href = a.getAttribute("href") || "";
      const location = getSectionLocation(a);

      track("cta_click", {
        cta: ctaText,
        href: href,
        location: location
      });
    }, { passive:true });

    document.addEventListener("submit", function(e){
      const form = e.target;
      if(form && form.id === "contactForm"){
        track("lead_submit", {
          form: "home_contact",
          location: "contact"
        });
      }
    }, { passive:true });
  </script>
